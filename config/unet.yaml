# U-Net segmentation configuration for v0.1.0.
# Paths are resolved relative to the repository root unless absolute.
project:
  name: 03-image-segmentation
  seed: 42
  device: auto

data:
  root: data
  image_dir: images
  mask_dir: masks
  splits:
    train: 64
    val: 16
    test: 16
  image_size: [128, 128]
  channels: 3
  classes: 2
  num_workers: 0
  mask_suffix: _mask

model:
  in_channels: 3
  out_channels: 1
  base_filters: 32
  depth: 4
  dropout: 0.0

train:
  epochs: 20
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  loss: bce_dice
  bce_weight: 0.5
  dice_weight: 0.5
  scheduler: plateau
  patience: 5
  min_delta: 0.001
  checkpoint_dir: models
  best_checkpoint: best.pt
  last_checkpoint: last.pt
  history_path: results/train_history.json

eval:
  batch_size: 8
  threshold: 0.5
  output_dir: results/eval
  metrics_path: results/eval/metrics.json

infer:
  threshold: 0.5
  output_dir: results/predictions

app:
  results_dir: results
  output_path: results/gallery.html
